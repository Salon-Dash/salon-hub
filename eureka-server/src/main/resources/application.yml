server:
  port: 8761

spring:
  flyway:
    table: flyway_history_eureka_server
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
