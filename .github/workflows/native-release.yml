name: Native Image Release

# Triggered only on version tags: git tag v1.2.3 && git push --tags
# Builds GraalVM native images for ALL services — ~8-15 min each, but runs in parallel.
# Result: ~30-60 MB images, 30-60 MB RAM each vs 200-500 MB for JVM images.
#
# Usage:
#   git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/salon-dash/salon-hub

jobs:
  build-native:
    name: Native — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # All services build in parallel — total wall-clock time = slowest single service
      fail-fast: false
      matrix:
        service:
          - invitation-service
          - referral-service
          - payment-service
          - business-hours-service
          - time-off-service
          - business-service
          - staff-service
          - auth-service
          - service-catalog-service
          - booking-service
          - notification-service
          - api-gateway
          - eureka-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use larger driver for faster native compilation
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} (native)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile.native
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:native
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:native-${{ github.ref_name }}
          # GHA cache dramatically speeds up repeat native builds (deps layer cached)
          cache-from: type=gha,scope=native-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.service }}

  deploy-native:
    name: Deploy all native images to VPS
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Pull all native images in parallel and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR
          command_timeout: 15m
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd /opt/salon-hub

            SERVICES="invitation-service referral-service payment-service business-hours-service time-off-service business-service staff-service auth-service service-catalog-service booking-service notification-service api-gateway eureka-server"

            # Pull all native images in parallel
            echo "Pulling all native images in parallel..."
            PIDS=()
            for svc in $SERVICES; do
              docker pull "ghcr.io/salon-dash/salon-hub/${svc}:native" &
              PIDS+=($!)
            done
            for pid in "${PIDS[@]}"; do wait "$pid" || true; done
            echo "All native images pulled"

            # Tag each :native image as :latest so docker-compose picks it up
            for svc in $SERVICES; do
              docker tag "ghcr.io/salon-dash/salon-hub/${svc}:native" \
                         "ghcr.io/salon-dash/salon-hub/${svc}:latest" || true
            done

            # Restart all services with native images (compose uses :latest)
            IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
            echo "=== Native release deployed ==="
            docker compose -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Image}}"
