name: Native Image Release

# Triggered only on version tags: git tag v1.2.3 && git push --tags
# Builds GraalVM native images for eligible services — slow but ~5x smaller RAM.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/salon-dash/salon-hub

# Services that have a Dockerfile.native ready for native compilation
# Add more services here as they are migrated to native
jobs:
  build-native:
    name: Native — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - invitation-service
          # Add when ready:
          # - referral-service
          # - payment-service
          # - business-hours-service
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} (native)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile.native
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:native
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:native-${{ github.ref_name }}
          cache-from: type=gha,scope=native-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.service }}

  deploy-native:
    name: Deploy native images to VPS
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Deploy native services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd /opt/salon-hub

            # Pull and swap each native service
            for svc in invitation-service; do
              echo "Deploying native $svc..."
              docker pull "ghcr.io/salon-dash/salon-hub/${svc}:native"
              # Update docker-compose to use :native tag for this service
              IMAGE_TAG=native docker compose -f docker-compose.prod.yml up -d --no-deps "$svc"
            done

            docker image prune -f
            echo "Native deploy complete"
            docker compose -f docker-compose.prod.yml ps
