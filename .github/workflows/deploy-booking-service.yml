name: Deploy Booking Service

on:
  push:
    branches: [ main, master ]
    paths:
      - 'booking-service/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'booking-service/**'
  workflow_dispatch:

env:
  PROJECT_ID: salon-hub-483509
  REGION: us-central1
  REPOSITORY: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/booksy-repo
  IMAGE_NAME: booking-service
  VM_NAME: booksy-vm
  ZONE: us-central1-a

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests
      run: |
        cd booking-service
        mvn test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: |
        cd booking-service
        mvn clean package

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker to use gcloud as a credential helper
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./booking-service
        push: true
        tags: |
          ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to VM
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Deploying to VM: ${{ env.VM_NAME }}"

        # Copy deployment script to VM
        gcloud compute scp deploy-to-vm.sh ${{ env.VM_NAME }}:~/ --zone=${{ env.ZONE }} --quiet

        # Execute deployment on VM
        gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --command="
          chmod +x ~/deploy-to-vm.sh
          ~/deploy-to-vm.sh ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        " --quiet

    - name: Health check
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Performing health check..."
        sleep 30

        # Get VM external IP
        VM_IP=\$(gcloud compute instances describe ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --format="get(networkInterfaces[0].accessConfigs[0].natIP)")

        # Test health endpoint
        if curl -f -s http://\$VM_IP:8084/actuator/health > /dev/null; then
          echo "Health check passed"
        else
          echo "Health check failed"
          exit 1
        fi

        # Test availability endpoint
        if curl -f -s http://\$VM_IP:8084/api/public/studios/1/services/1/availability?daysAhead=1 > /dev/null; then
          echo "Availability endpoint responding"
        else
          echo "Availability endpoint not working"
          exit 1
        fi
