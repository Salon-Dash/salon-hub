name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/salon-dash/salon-hub

# ─────────────────────────────────────────────
# Job 1: Detect which services actually changed
# ─────────────────────────────────────────────
jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      frontend: ${{ steps.detect.outputs.frontend }}
      deploy-config: ${{ steps.detect.outputs.deploy-config }}
      any-change: ${{ steps.detect.outputs.any-change }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: detect
        run: |
          # Get list of changed files vs previous commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)

          echo "Changed files:"
          echo "$CHANGED"

          # If parent pom.xml changed, all Java services must rebuild
          PARENT_POM=$(echo "$CHANGED" | grep -q "^pom\.xml$" && echo true || echo false)

          # Build list of services that need rebuilding
          SERVICES=()
          ALL_SVCS=(auth-service booking-service business-service staff-service \
                    service-catalog-service business-hours-service time-off-service \
                    notification-service api-gateway eureka-server \
                    payment-service invitation-service referral-service)

          for svc in "${ALL_SVCS[@]}"; do
            SVC_CHANGED=$(echo "$CHANGED" | grep -q "^${svc}/" && echo true || echo false)
            if [ "$SVC_CHANGED" = "true" ] || [ "$PARENT_POM" = "true" ]; then
              SERVICES+=("$svc")
            fi
          done

          # Convert to JSON array
          if [ ${#SERVICES[@]} -eq 0 ]; then
            SERVICES_JSON="[]"
          else
            SERVICES_JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -sc .)
          fi

          # Frontend changed?
          FRONTEND=$(echo "$CHANGED" | grep -q "^salon-hub/" && echo true || echo false)

          # Deploy config only (docker-compose.prod.yml, nginx config, .env.example)
          DEPLOY_CONFIG=$(echo "$CHANGED" | grep -qE "^docker-compose|^nginx|^\.env" && echo true || echo false)

          # Any change at all
          ANY=false
          if [ "$SERVICES_JSON" != "[]" ] || [ "$FRONTEND" = "true" ] || [ "$DEPLOY_CONFIG" = "true" ]; then
            ANY=true
          fi

          echo "services=$SERVICES_JSON"     >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND"          >> $GITHUB_OUTPUT
          echo "deploy-config=$DEPLOY_CONFIG" >> $GITHUB_OUTPUT
          echo "any-change=$ANY"             >> $GITHUB_OUTPUT

          echo "--- Summary ---"
          echo "Services to rebuild: $SERVICES_JSON"
          echo "Frontend changed:    $FRONTEND"
          echo "Deploy config only:  $DEPLOY_CONFIG"
          echo "Any change:          $ANY"

# ─────────────────────────────────────────────
# Job 2: Build only changed backend services
# ─────────────────────────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# ─────────────────────────────────────────────
# Job 3: Build admin dashboard only if changed
# ─────────────────────────────────────────────
  build-frontend:
    name: Build admin dashboard
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: salon-hub/package-lock.json

      - name: Install & build
        working-directory: salon-hub
        run: |
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: salon-hub/dist/
          retention-days: 1

# ─────────────────────────────────────────────
# Job 4: Deploy — only if something changed
# ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [detect-changes, build-services, build-frontend]
    # Run deploy if: any service built, or frontend built, or config-only change
    # Use always() so we run even if build-services or build-frontend were skipped
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any-change == 'true' &&
      !contains(needs.build-services.result, 'failure') &&
      !contains(needs.build-frontend.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Download admin dashboard (if rebuilt)
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: admin-dashboard-dist
          path: dist/

      - name: Copy admin dashboard to VPS
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/
          target: /var/www/salon-hub/

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml,.env.example
          target: /opt/salon-hub/

      - name: Deploy changed services on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,CHANGED_SERVICES
          command_timeout: 25m
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd /opt/salon-hub
            [ -f .env ] || cp .env.example .env

            # docker-compose.prod.yml changed — apply new config to ALL running services
            # (memory limits, env vars, etc. take effect on container recreate)
            if [ -z "$CHANGED_SERVICES" ] || [ "$CHANGED_SERVICES" = "[]" ]; then
              systemctl reload nginx 2>/dev/null || true
              echo "Config-only change — applying docker-compose updates to all services"
              IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d
              docker image prune -f
              echo "Config deploy done"
              exit 0
            fi

            # ── Step 1: Pull all changed images IN PARALLEL ──────────────────
            # Each pull is network-bound, not CPU-bound — parallelism cuts total
            # wait time from (N × pull_time) to (max single pull_time).
            echo "Pulling in parallel: $CHANGED_SERVICES"
            SVCS=$(echo "$CHANGED_SERVICES" | tr -d '[]"' | tr ',' '\n' | tr -d ' ' | grep -v '^$')
            PIDS=()
            for svc in $SVCS; do
              docker pull "ghcr.io/salon-dash/salon-hub/${svc}:latest" &
              PIDS+=($!)
            done
            for pid in "${PIDS[@]}"; do wait "$pid" || true; done
            echo "All images pulled"

            # ── Step 2: Restart only the changed services ─────────────────────
            for svc in $SVCS; do
              echo "Restarting: $svc"
              IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d --no-deps "$svc" || true
            done

            # ── Step 3: Ensure infra is healthy (start if stopped, skip if running) ──
            for infra in postgres redis eureka-server api-gateway; do
              RUNNING=$(docker inspect --format '{{.State.Running}}' "salon-hub-${infra}-1" 2>/dev/null || echo "false")
              if [ "$RUNNING" != "true" ]; then
                echo "Starting stopped infra: $infra"
                IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d "$infra" || true
              fi
            done

            # ── Step 4: Prune dangling images to free disk ────────────────────
            docker image prune -f

            echo "=== Deploy complete ==="
            docker compose -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"
