server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: business-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booksy_platform}
    username: ${SPRING_DATASOURCE_USERNAME:booksy}
    password: ${SPRING_DATASOURCE_PASSWORD:booksy_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    table: flyway_history_business_service
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false  # Disable to prevent connection leaks and improve performance
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:business-service}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    com.booksy: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

