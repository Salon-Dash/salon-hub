version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: booksy_platform
      POSTGRES_USER: booksy
      POSTGRES_PASSWORD: booksy_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U booksy -d booksy_platform"], interval: 10s, timeout: 5s, retries: 5}

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5}

  eureka-server:
    build: ./eureka-server
    ports: ["8761:8761"]
    environment:
      SERVER_PORT: 8761
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"], interval: 15s, timeout: 5s, retries: 10}

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-in-prod!!}
    depends_on: {eureka-server: {condition: service_healthy}, redis: {condition: service_healthy}}

  auth-service:
    build: ./auth-service
    ports: ["8082:8082"]
    environment: &common-env
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_NAME: booksy_platform
      SPRING_DATASOURCE_USERNAME: booksy
      SPRING_DATASOURCE_PASSWORD: booksy_dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksy_platform
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-in-prod!!}
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  booking-service:
    build: ./booking-service
    ports: ["8084:8084"]
    environment:
      <<: *common-env
      SERVER_PORT: 8084
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}, redis: {condition: service_healthy}}

  business-service:
    build: ./business-service
    ports: ["8085:8085"]
    environment:
      <<: *common-env
      SERVER_PORT: 8085
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  staff-service:
    build: ./staff-service
    ports: ["8086:8086"]
    environment:
      <<: *common-env
      SERVER_PORT: 8086
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  service-catalog-service:
    build: ./service-catalog-service
    ports: ["8087:8087"]
    environment:
      <<: *common-env
      SERVER_PORT: 8087
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  business-hours-service:
    build: ./business-hours-service
    ports: ["8088:8088"]
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      SPRING_CACHE_TYPE: simple
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  time-off-service:
    build: ./time-off-service
    ports: ["8089:8089"]
    environment:
      <<: *common-env
      SERVER_PORT: 8089
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}}

  notification-service:
    build: ./notification-service
    ports: ["8090:8090"]
    environment:
      <<: *common-env
      SERVER_PORT: 8090
      NOTIFICATION_EMAIL_ENABLED: "false"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-noreply@booksy.com}
    depends_on: {postgres: {condition: service_healthy}, eureka-server: {condition: service_healthy}, redis: {condition: service_healthy}}

volumes:
  postgres_data:
