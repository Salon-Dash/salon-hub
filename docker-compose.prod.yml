version: '3.9'

x-common-env: &common-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksy_platform
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-booksy}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  JWT_SECRET: ${JWT_SECRET}
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
  # Lazy bean init — defers class loading, saves 20-40MB idle RAM per service
  SPRING_MAIN_LAZY_INITIALIZATION: "true"
  SPRING_JPA_OPEN_IN_VIEW: "false"
  # Eureka: 15s local cache so gateway doesn't hit Eureka on every request
  EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"

# Shared JVM flags — capped metaspace + string deduplication for all JPA services
# Formula: container limit = Xmx + MaxMetaspaceSize(100m) + native overhead(80m)
x-jpa-jvm: &jpa-jvm "-XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC -XX:MaxGCPauseMillis=100"

x-spring-healthcheck: &spring-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: booksy_platform
      POSTGRES_USER: ${DB_USER:-booksy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
        -c shared_buffers=96MB
        -c effective_cache_size=256MB
        -c max_connections=80
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booksy} -d booksy_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 80mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96m

  eureka-server:
    image: ghcr.io/salon-dash/salon-hub/eureka-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      # Xmx80 + 100 meta + 80 native = 260m limit
      JAVA_TOOL_OPTIONS: "-Xmx80m -Xms32m *jpa-jvm*"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 260m

  api-gateway:
    image: ghcr.io/salon-dash/salon-hub/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      # Xmx160 + 100 meta + 80 native = 340m limit
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms64m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,
        org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 340m

  auth-service:
    image: ghcr.io/salon-dash/salon-hub/auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      SPRING_FLYWAY_TABLE: flyway_history_auth
      # Xmx140 + 100 meta + 80 native = 320m limit
      JAVA_TOOL_OPTIONS: "-Xmx140m -Xms56m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 320m

  booking-service:
    image: ghcr.io/salon-dash/salon-hub/booking-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      SPRING_FLYWAY_TABLE: flyway_history_booking
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      SERVICES_NOTIFICATION_URL: http://notification-service:8090
      # Xmx300 + 100 meta + 80 native = 480m limit (largest service — most logic)
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms100m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 480m

  business-service:
    image: ghcr.io/salon-dash/salon-hub/business-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      SPRING_FLYWAY_TABLE: flyway_history_business
      # Xmx120 + 100 meta + 80 native = 300m limit
      JAVA_TOOL_OPTIONS: "-Xmx120m -Xms48m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 300m

  staff-service:
    image: ghcr.io/salon-dash/salon-hub/staff-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      SPRING_FLYWAY_TABLE: flyway_history_staff
      # Xmx120 + 100 meta + 80 native = 300m limit
      JAVA_TOOL_OPTIONS: "-Xmx120m -Xms48m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 300m

  service-catalog-service:
    image: ghcr.io/salon-dash/salon-hub/service-catalog-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      SPRING_FLYWAY_TABLE: flyway_history_catalog
      # Xmx110 + 100 meta + 80 native = 290m limit
      JAVA_TOOL_OPTIONS: "-Xmx110m -Xms44m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 290m

  business-hours-service:
    image: ghcr.io/salon-dash/salon-hub/business-hours-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      SPRING_FLYWAY_TABLE: flyway_history_biz_hours
      SPRING_CACHE_TYPE: redis
      # Xmx100 + 100 meta + 80 native = 280m limit
      JAVA_TOOL_OPTIONS: "-Xmx100m -Xms40m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 280m

  time-off-service:
    image: ghcr.io/salon-dash/salon-hub/time-off-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8089
      SPRING_FLYWAY_TABLE: flyway_history_timeoff
      # Xmx100 + 100 meta + 80 native = 280m limit
      JAVA_TOOL_OPTIONS: "-Xmx100m -Xms40m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 280m

  notification-service:
    image: ghcr.io/salon-dash/salon-hub/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8090
      SPRING_FLYWAY_TABLE: flyway_history_notification
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      EUREKA_CLIENT_HEALTHCHECK_ENABLED: "false"
      # Xmx160 + 100 meta + 80 native = 340m limit
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms64m -XX:MaxMetaspaceSize=100m -XX:+UseStringDeduplication -XX:+UseG1GC"
      NOTIFICATION_EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM_EMAIL: ${FROM_EMAIL:-noreply@salon-hub.com}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 340m

  payment-service:
    image: ghcr.io/salon-dash/salon-hub/payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8095
      SPRING_FLYWAY_TABLE: flyway_history_payment
      # Disable JPA/Hibernate — this service only uses JdbcTemplate (saves ~50MB metaspace)
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,
        org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      # Xmx80 + 60 meta (no Hibernate) + 80 native = 220m limit
      JAVA_TOOL_OPTIONS: "-Xmx80m -Xms32m -XX:MaxMetaspaceSize=60m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 220m

  invitation-service:
    image: ghcr.io/salon-dash/salon-hub/invitation-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8091
      SPRING_FLYWAY_TABLE: flyway_history_invitation
      # Disable JPA/Hibernate — this service only uses JdbcTemplate (saves ~50MB metaspace)
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,
        org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      # Xmx80 + 60 meta (no Hibernate) + 80 native = 220m limit
      JAVA_TOOL_OPTIONS: "-Xmx80m -Xms32m -XX:MaxMetaspaceSize=60m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 220m

  referral-service:
    image: ghcr.io/salon-dash/salon-hub/referral-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8092
      SPRING_FLYWAY_TABLE: flyway_history_referral
      # Disable JPA/Hibernate — stub service (saves ~50MB metaspace)
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,
        org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      # Xmx64 + 60 meta (no Hibernate) + 76 native = 200m limit
      JAVA_TOOL_OPTIONS: "-Xmx64m -Xms28m -XX:MaxMetaspaceSize=60m -XX:+UseStringDeduplication -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 200m

volumes:
  postgres_data:

networks:
  default:
    name: salon-hub-net
