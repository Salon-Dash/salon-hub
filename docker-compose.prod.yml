version: '3.9'

x-common-env: &common-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksy_platform
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-booksy}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  JWT_SECRET: ${JWT_SECRET}
  # Flyway: each service uses its own history table so shared 'public' schema
  # doesn't cause checksum conflicts between services
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"

x-spring-healthcheck: &spring-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: booksy_platform
      POSTGRES_USER: ${DB_USER:-booksy}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booksy} -d booksy_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m

  eureka-server:
    image: ghcr.io/salon-dash/salon-hub/eureka-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  api-gateway:
    image: ghcr.io/salon-dash/salon-hub/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      # Disable Spring Security auto-config — gateway is a transparent proxy.
      # Each downstream service enforces its own JWT auth.
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,
        org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 320m

  auth-service:
    image: ghcr.io/salon-dash/salon-hub/auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      SPRING_FLYWAY_TABLE: flyway_history_auth
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 320m

  booking-service:
    image: ghcr.io/salon-dash/salon-hub/booking-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      SPRING_FLYWAY_TABLE: flyway_history_booking
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      SERVICES_NOTIFICATION_URL: http://notification-service:8090
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 512m

  business-service:
    image: ghcr.io/salon-dash/salon-hub/business-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      SPRING_FLYWAY_TABLE: flyway_history_business
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 320m

  staff-service:
    image: ghcr.io/salon-dash/salon-hub/staff-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      SPRING_FLYWAY_TABLE: flyway_history_staff
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms64m"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 320m

  service-catalog-service:
    image: ghcr.io/salon-dash/salon-hub/service-catalog-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      SPRING_FLYWAY_TABLE: flyway_history_catalog
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  business-hours-service:
    image: ghcr.io/salon-dash/salon-hub/business-hours-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      SPRING_FLYWAY_TABLE: flyway_history_biz_hours
      SPRING_CACHE_TYPE: redis
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  time-off-service:
    image: ghcr.io/salon-dash/salon-hub/time-off-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8089
      SPRING_FLYWAY_TABLE: flyway_history_timeoff
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  notification-service:
    image: ghcr.io/salon-dash/salon-hub/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8090
      SPRING_FLYWAY_TABLE: flyway_history_notification
      # Disable optional health indicators so Redis/SMTP timeouts don't cause DOWN
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      EUREKA_CLIENT_HEALTHCHECK_ENABLED: "false"
      # JVM uses -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 → 288m heap with 384m limit
      NOTIFICATION_EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM_EMAIL: ${FROM_EMAIL:-noreply@salon-hub.com}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 384m

  payment-service:
    image: ghcr.io/salon-dash/salon-hub/payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8095
      SPRING_FLYWAY_TABLE: flyway_history_payment
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  invitation-service:
    image: ghcr.io/salon-dash/salon-hub/invitation-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8091
      SPRING_FLYWAY_TABLE: flyway_history_invitation
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

  referral-service:
    image: ghcr.io/salon-dash/salon-hub/referral-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8092
      SPRING_FLYWAY_TABLE: flyway_history_referral
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health > /dev/null || exit 1"]
      <<: *spring-healthcheck
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:

networks:
  default:
    name: salon-hub-net
